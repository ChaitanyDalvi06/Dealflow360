<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — DealFlow360</title>
  <meta name="description"
    content="Log in to your DealFlow360 sales workspace or customer negotiation portal." />

  <!-- Google Fonts: Inter (body), Space Grotesk (tech display), Instrument Serif (editorial accent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    /* -------------------------------------------------------------
       COLOR SYSTEM & DESIGN TOKENS (Brand Palette)
       --bg-primary: #F8F0E5 (Warm off-white)
       --bg-secondary: #EADBC8 (Secondary warm beige)
       --accent-tan: #DAC0A3 (Muted tan / accent border)
       --navy-deep: #0F2C59 (Deep navy / primary dark / text)
    -------------------------------------------------------------- */
    :root {
      --bg-primary: #F8F0E5;
      --bg-secondary: #EADBC8;
      --accent-tan: #DAC0A3;
      --navy-deep: #0F2C59;
      --navy-dark: #0A1E3D;
      --navy-surface: #143566;
      --navy-muted: rgba(15, 44, 89, 0.65);
      --navy-subtle: rgba(15, 44, 89, 0.08);
      --navy-border: rgba(15, 44, 89, 0.14);
      --tan-border: rgba(218, 192, 163, 0.55);
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Space Grotesk', -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --transition: all 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(15, 44, 89, 0.05);
      --shadow-md: 0 10px 30px rgba(15, 44, 89, 0.08);
      --shadow-lg: 0 20px 50px rgba(15, 44, 89, 0.12);
    }

    /* -------------------------------------------------------------
       GLOBAL RESET & TYPOGRAPHY
    -------------------------------------------------------------- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      background-color: var(--bg-primary);
      color: var(--navy-deep);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }

    body {
      font-family: var(--font-body);
      line-height: 1.6;
      background-color: var(--bg-primary);
      color: var(--navy-deep);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Subtle Grain Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.12;
      color: var(--navy-deep);
    }

    p {
      color: var(--navy-muted);
      font-weight: 400;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition);
    }

    .editorial {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* -------------------------------------------------------------
       TOP RIGHT BACK TO WEBSITE BUTTON
    -------------------------------------------------------------- */
    .back-to-website-btn {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.15rem;
      font-family: var(--font-display, 'Space Grotesk', sans-serif);
      font-size: 0.85rem;
      font-weight: 700;
      color: #0F2C59;
      background: #FAF7F2;
      border: 1.5px solid #0F2C59;
      border-radius: 9999px;
      box-shadow: 2px 2px 0px #0F2C59;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-to-website-btn:hover {
      transform: translateY(-2px);
      box-shadow: 3.5px 3.5px 0px #0F2C59;
      background: #FFFFFF;
    }

    .back-to-website-btn svg {
      transition: transform 0.2s ease;
    }

    .back-to-website-btn:hover svg {
      transform: translateX(-3px);
    }

    .login-nav {
      display: none !important;
    }

    /* -------------------------------------------------------------
       SPLIT LAYOUT CONTAINER
    -------------------------------------------------------------- */
    .login-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      min-height: 100vh;
      position: relative;
    }

    /* LEFT HERO / AMBIENT PANEL */
    .hero-panel {
      background: radial-gradient(circle at 30% 20%, rgba(234, 219, 200, 0.8) 0%, rgba(248, 240, 229, 0.4) 70%);
      padding: 4rem 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid var(--tan-border);
      position: relative;
    }

    .hero-panel.hero-panel-image {
      padding: 1.75rem !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-right: none !important;
    }

    .hero-image-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      border: 1.5px solid #0F2C59;
      box-shadow: 4px 4px 0px #0F2C59;
      position: relative;
      background: #0A1E3D;
      display: flex;
    }

    .hero-image-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .hero-panel h1 {
      font-size: clamp(2.1rem, 3.4vw, 3rem);
      margin-bottom: 1.1rem;
    }

    .hero-panel p.lead {
      font-size: 1.05rem;
      color: var(--navy-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Minimal 3-Point Highlights */
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .feature-row {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
    }

    .feature-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--accent-tan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-deep);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .feature-icon-box svg {
      width: 16px;
      height: 16px;
    }

    .feature-text strong {
      display: block;
      font-size: 0.92rem;
      color: var(--navy-deep);
      font-weight: 600;
    }

    .feature-text span {
      font-size: 0.82rem;
      color: var(--navy-muted);
    }

    /* RIGHT FORM PANEL */
    .form-panel {
      padding: 4rem 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary);
    }

    .form-container {
      width: 100%;
      max-width: 440px;
    }

    .form-header {
      margin-bottom: 1.8rem;
    }

    .form-header h2 {
      font-size: 1.95rem;
      margin-bottom: 0.4rem;
    }

    .form-header p {
      font-size: 0.92rem;
      color: var(--navy-muted);
    }

    /* Portal View Tab Switcher */
    .portal-tabs {
      display: flex;
      background: var(--bg-secondary);
      border: 1px solid var(--accent-tan);
      padding: 4px;
      border-radius: var(--radius-sm);
      margin-bottom: 1.6rem;
    }

    .portal-tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 0.55rem;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--navy-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .portal-tab-btn.active {
      background: #FFFFFF;
      color: var(--navy-deep);
      box-shadow: var(--shadow-sm);
    }

    /* SSO Button */
    .btn-sso {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--accent-tan);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--navy-deep);
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-display);
      margin-bottom: 1.5rem;
    }

    .btn-sso:hover {
      background: #FFFFFF;
      border-color: var(--navy-deep);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .divider-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      color: rgba(15, 44, 89, 0.4);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .divider-row::before,
    .divider-row::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--tan-border);
    }

    /* Form Fields */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--navy-deep);
      letter-spacing: -0.01em;
    }

    .forgot-link {
      font-size: 0.78rem;
      color: var(--navy-muted);
      font-weight: 500;
    }

    .forgot-link:hover {
      color: var(--navy-deep);
      text-decoration: underline;
    }

    .form-input {
      width: 100%;
      padding: 0.78rem 0.95rem;
      background: var(--bg-primary);
      border: 1px solid var(--accent-tan);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--navy-deep);
      transition: var(--transition);
      outline: none;
    }

    .form-input::placeholder {
      color: rgba(15, 44, 89, 0.4);
    }

    .form-input:focus {
      border-color: var(--navy-deep);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(15, 44, 89, 0.1);
    }

    /* Primary Submit Button */
    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: var(--navy-deep);
      color: var(--bg-primary);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(15, 44, 89, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--navy-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(15, 44, 89, 0.4);
    }

    /* Form Footer */
    .form-footer-note {
      text-align: center;
      font-size: 0.85rem;
      color: var(--navy-muted);
      margin-top: 1.8rem;
    }

    .form-footer-note a {
      color: var(--navy-deep);
      font-weight: 700;
    }

    /* -------------------------------------------------------------
       RESPONSIVE BREAKPOINTS
    -------------------------------------------------------------- */
    @media (max-width: 960px) {
      .login-wrapper {
        grid-template-columns: 1fr;
      }

      .hero-panel {
        padding: 3rem 2rem;
        border-right: none;
        border-bottom: 1px solid var(--tan-border);
      }

      .hero-panel.hero-panel-image {
        height: 280px;
        min-height: 280px;
        padding: 0 !important;
      }

      .form-panel {
        padding: 3rem 1.5rem;
      }
    }
  </style>
</head>

  <!-- Top Right Navigation Back to Website Button -->
  <a href="index.html" class="back-to-website-btn" id="backToWebsiteBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Back to website</span>
  </a>

  <!-- Main Split Layout -->
  <main class="login-wrapper">

    <!-- LEFT HERO / IMAGE PANEL -->
    <section class="hero-panel hero-panel-image">
      <div class="hero-image-wrapper">
        <img src="loginhd.png" alt="DealFlow360 Intelligent Negotiation" class="hero-image-cover" />
      </div>
    </section>

    <!-- RIGHT FORM PANEL -->
    <section class="form-panel">
      <div class="form-container">
        
        <div class="form-header">
          <h2 id="loginTitle">Log in to DealFlow360</h2>
          <p id="loginSubtitle">Enter your email and password to access your account.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-grid">
            
            <div class="form-group">
              <label class="form-label" for="loginEmail" id="emailLabel">Email</label>
              <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required />
            </div>

            <div class="form-group" id="passwordGroup">
              <div class="form-label-row">
                <label class="form-label" for="loginPassword">Password</label>
                <a href="#" class="forgot-link" onclick="alert('Password reset link sent to your registered email.')">Forgot password?</a>
              </div>
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required />
            </div>

            <button type="submit" class="btn-submit" id="btnSubmitLogin">
              <span>Sign In</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>

          </div>
        </form>

        <div class="form-footer-note">
          Don't have an organization workspace? <a href="signup.html">Create an Account</a>
        </div>

      </div>
    </section>

  </main>

  <script>
    // Tab Mode Toggle: Workspace vs Customer Portal
    let currentMode = 'workspace';

    function setLoginMode(mode) {
      currentMode = mode;
      const tabRep = document.getElementById('tabRep');
      const tabCustomer = document.getElementById('tabCustomer');
      const title = document.getElementById('loginTitle');
      const subtitle = document.getElementById('loginSubtitle');
      const emailLabel = document.getElementById('emailLabel');
      const emailInput = document.getElementById('loginEmail');
      const btn = document.getElementById('btnSubmitLogin');

      if (mode === 'workspace') {
        tabRep.classList.add('active');
        tabCustomer.classList.remove('active');
        title.textContent = 'Log in to portal';
        subtitle.textContent = 'Enter your credentials to enter your workspace.';
        emailLabel.textContent = 'Corporate Email';
        emailInput.placeholder = 'rep@company.com';
        btn.querySelector('span').textContent = 'Sign in to Workspace';
      } else {
        tabCustomer.classList.add('active');
        tabRep.classList.remove('active');
        title.textContent = 'Customer Negotiation Portal';
        subtitle.textContent = 'Access your live quotation and submit terms.';
        emailLabel.textContent = 'Customer Email or Magic Link ID';
        emailInput.placeholder = 'buyer@clientcorp.com';
        btn.querySelector('span').textContent = 'Open Negotiation Portal';
      }
    }

    // Simulate Google Login
    function simulateGoogleLogin() {
      alert('Authenticating with Google Workspace. Redirecting to workspace demo...');
      window.location.href = 'index.html#demo-frame';
    }

    // Form Submit Handler
    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitLogin');
      
      btn.disabled = true;
      btn.innerHTML = `<span>Authenticating...</span>`;

      setTimeout(() => {
        if (currentMode === 'workspace') {
          window.location.href = 'index.html#demo-frame';
        } else {
          // Switch directly to customer portal tab
          window.location.href = 'index.html#demo-frame';
        }
      }, 600);
    }
  </script>

</body>

</html>
